<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Core Inference UI</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
        .message { padding: 1rem 1.25rem; border-radius: 1rem; max-width: 85%; line-height: 1.5; font-size: 0.95rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 0.25rem; }
        .ai { align-self: flex-start; background: white; color: var(--text); border-bottom-left-radius: 0.25rem; border: 1px solid #e2e8f0; white-space: pre-wrap; }
        #input-container { padding: 1.5rem 2rem; background: white; border-top: 1px solid #e2e8f0; display: flex; gap: 0.75rem; box-shadow: 0 -4px 6px -1px rgba(0,0,0,0.05); }
        input { flex: 1; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: var(--primary); }
        button { padding: 0.75rem 1.5rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        think { display: block; font-style: italic; color: #64748b; background: #f1f5f9; padding: 0.75rem; border-left: 4px solid #cbd5e1; margin: 0.5rem 0; border-radius: 0.25rem; font-size: 0.9rem; }
        .loading-dots::after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60% { content: '...'; } 80%, 100% { content: ''; } }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <div id="input-container">
        <input type="text" id="prompt-input" placeholder="Ask anything..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            promptInput.value = '';
            addMessage('user', prompt);

            const aiMsgDiv = addMessage('ai', '');
            aiMsgDiv.classList.add('loading-dots');

            sendBtn.disabled = true;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                if (!response.ok) throw new Error("HTTP " + response.status);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = "";

                aiMsgDiv.classList.remove('loading-dots');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    fullText += decoder.decode(value, { stream: true });

                    // Simple replacement for rendering tags
                    let html = fullText
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/&lt;think&gt;/g, "<think>")
                        .replace(/&lt;\/think&gt;/g, "</think>");

                    aiMsgDiv.innerHTML = html;
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch (err) {
                aiMsgDiv.classList.remove('loading-dots');
                aiMsgDiv.innerText = "Error: " + err.message;
                aiMsgDiv.style.color = "#ef4444";
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.onclick = sendMessage;
        promptInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
    </script>
</body>
</html>
