<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust AI Engine</title>
    <style>
        :root { --primary: #000; --bg: #ffffff; --text: #1e293b; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; gap: 1rem; }
        .message { padding: 1rem; border-radius: 0.5rem; max-width: 85%; line-height: 1.6; }
        .user { align-self: flex-end; background: #f3f4f6; }
        .ai { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; white-space: pre-wrap; }
        #input-container { padding: 1.5rem; border-top: 1px solid #e5e7eb; display: flex; gap: 0.5rem; }
        input { flex: 1; padding: 0.75rem; border: 1px solid #e5e7eb; border-radius: 0.375rem; outline: none; }
        button { padding: 0.75rem 1.5rem; background: #000; color: white; border: none; border-radius: 0.375rem; cursor: pointer; }
        think { display: block; font-style: italic; color: #6b7280; background: #f9fafb; padding: 1rem; border-left: 3px solid #e5e7eb; margin: 1rem 0; }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <div id="input-container">
        <input type="text" id="prompt-input" placeholder="Type message..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>
    <script>
        const chat = document.getElementById('chat-container');
        const input = document.getElementById('prompt-input');
        const btn = document.getElementById('send-btn');

        async function send() {
            const prompt = input.value.trim();
            if (!prompt) return;
            input.value = '';

            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = prompt;
            chat.appendChild(userDiv);

            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai';
            chat.appendChild(aiDiv);

            btn.disabled = true;
            let fullText = "";

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt})
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const {done, value} = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, {stream: true});
                    const parts = buffer.split('\n\n');
                    buffer = parts.pop();

                    for (const part of parts) {
                        if (part.startsWith('data: ')) {
                            fullText += part.slice(6);
                            aiDiv.innerHTML = fullText.replace(/<think>([\s\S]*?)<\/think>/g, '<think>$1</think>');
                            chat.scrollTop = chat.scrollHeight;
                        }
                    }
                }
            } finally {
                btn.disabled = false;
            }
        }
        btn.onclick = send;
        input.onkeypress = (e) => e.key === 'Enter' && send();
    </script>
</body>
</html>
