[package]
name = "core_ai"
version = "0.1.0"
edition = "2021"

[dependencies]
safetensors = "0.4.5"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
axum = "0.7"
futures-util = "0.3"
tower-http = { version = "0.5", features = ["cors", "fs"] }
bytes = "1.0"
memmap2 = "0.9"
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
